name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: tar -czf pal-${{ github.ref_name }}-arm64.tar.gz -C target/release pal
      - uses: softprops/action-gh-release@v2
        with:
          files: pal-${{ github.ref_name }}-arm64.tar.gz
